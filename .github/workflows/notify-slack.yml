# =============================================================================
# notify-slack — REUSABLE WORKFLOW for Slack CI/publish notifications.
#
# Lives ONCE in this PUBLIC repo. Any repository on GitHub calls it as a job:
#
#   jobs:
#     slack-notify:
#       needs: my-publish-job
#       if: always()
#       uses: M-Tayyab06/shared-workflows/.github/workflows/notify-slack.yml@v1
#       with:
#         status: ${{ needs.my-publish-job.result }}
#         title: 'My pipeline'
#       secrets:
#         SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
#         SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
#
# ⚠ THIS FILE CONTAINS NO SECRETS — and must NEVER contain any. Every caller
#   brings its own Slack token and channel via the `secrets:` block. That is
#   what makes it safe to publish this repo publicly.
#
# Message shapes:
#   success + image_ref + image_digest → "published" + Docker Hub button
#   success without digest             → ":white_check_mark: passed"
#   failure                            → ":x: FAILED" (+ optional blocked reason)
#   cancelled / skipped                → quiet note, no @channel ping
#
# A reusable workflow CANNOT see the caller's steps. Anything the caller wants
# in the message (image tag, digest, scan count…) must arrive via `with:`.
#
# Context note: inside a called workflow, github.repository / github.ref_name /
# github.actor / github.run_id / github.sha resolve to the CALLER's run — the
# defaults below are already correct; callers don't pass them.
#
# Uses only preinstalled jq + curl — NO third-party actions — so no caller's
# allowed-actions policy can block it.
#
# Layout (single section, hand-written style):
#   :emoji: *Title — outcome*        ← one bold header line
#   <!channel>                        ← own line, only when ping enabled
#   one short summary line
#   • Branch: `…`                    ← bullet metadata, only what's relevant
#   • Tag / Digest / Scan / Triggered by
#   [View run] [Docker Hub]          ← buttons
#   repo · run · commit              ← small grey footer line
# =============================================================================
name: Notify Slack (Reusable)

on:
  workflow_call:
    inputs:
      status:
        description: 'success | failure | cancelled | skipped — usually needs.<job>.result'
        required: true
        type: string
      title:
        description: 'Human name of the pipeline, e.g. "Backend image publish"'
        required: false
        type: string
        default: 'CI pipeline'
      detail:
        description: 'One-line explanation (e.g. why a publish was blocked)'
        required: false
        type: string
        default: ''
      image_ref:
        description: 'Full image reference repo:tag — empty for non-publish pipelines'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Tag only (drives the Docker Hub deep-link)'
        required: false
        type: string
        default: ''
      image_digest:
        description: 'sha256:… — only present when the image was actually pushed'
        required: false
        type: string
        default: ''
      dockerhub_repo:
        description: 'Docker Hub repo (org/name) — enables the Docker Hub button'
        required: false
        type: string
        default: ''
      scan_summary:
        description: 'Scan verdict text, e.g. "clean — 0 HIGH/CRITICAL"'
        required: false
        type: string
        default: ''
      ping_channel:
        description: 'true → <!channel> ping on success and failure'
        required: false
        type: string
        default: 'true'
      # Defaults resolve to the CALLER's context — no need to pass these.
      repo:
        required: false
        type: string
        default: ${{ github.repository }}
      branch:
        required: false
        type: string
        default: ${{ github.ref_name }}
      actor:
        required: false
        type: string
        default: ${{ github.actor }}
      run_id:
        required: false
        type: string
        default: ${{ github.run_id }}
    secrets:
      # ⚠ Deliberately TWO SEPARATE secrets, always caller-supplied.
      #   A reusable workflow never inherits secrets implicitly.
      SLACK_BOT_TOKEN:
        description: 'Slack bot token (xoxb-…), scope chat:write, bot invited to channel'
        required: true
      SLACK_CHANNEL_ID:
        description: 'Slack channel ID (C0…)'
        required: true

permissions:
  contents: read

jobs:
  notify:
    name: Send Slack notification
    runs-on: ubuntu-latest
    steps:
      - name: Build payload & send
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          STATUS:         ${{ inputs.status }}
          TITLE:          ${{ inputs.title }}
          DETAIL:         ${{ inputs.detail }}
          IMAGE_REF:      ${{ inputs.image_ref }}
          IMAGE_TAG:      ${{ inputs.image_tag }}
          IMAGE_DIGEST:   ${{ inputs.image_digest }}
          DOCKERHUB_REPO: ${{ inputs.dockerhub_repo }}
          SCAN_SUMMARY:   ${{ inputs.scan_summary }}
          PING_CHANNEL:   ${{ inputs.ping_channel }}
          IN_REPO:        ${{ inputs.repo }}
          IN_BRANCH:      ${{ inputs.branch }}
          IN_ACTOR:       ${{ inputs.actor }}
          IN_RUN_ID:      ${{ inputs.run_id }}
          GITHUB_SHA_VAL: ${{ github.sha }}
        run: |
          set -euo pipefail

          for v in SLACK_BOT_TOKEN SLACK_CHANNEL_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::${v} is empty — the caller must pass it via its \`secrets:\` block."
              exit 1
            fi
          done

          SHA_SHORT="${GITHUB_SHA_VAL:0:7}"
          # Full digests are 71 chars — show sha256: + 12 hex chars, enough to identify.
          DIGEST_SHORT="${IMAGE_DIGEST:0:19}"
          RUN_URL="https://github.com/${IN_REPO}/actions/runs/${IN_RUN_ID}"
          COMMIT_URL="https://github.com/${IN_REPO}/commit/${GITHUB_SHA_VAL}"

          # ── classify ──────────────────────────────────────────────────────
          PING=""
          if [ "${PING_CHANNEL}" = "true" ] \
             && [ "${STATUS}" != "cancelled" ] && [ "${STATUS}" != "skipped" ]; then
            PING="<!channel>"
          fi

          case "${STATUS}" in
            success)
              if [ -n "${IMAGE_REF}" ] && [ -n "${IMAGE_DIGEST}" ]; then
                HEADER="*${TITLE} — published*"
                SUMMARY="\`${IMAGE_REF}\` is pushed and ready to pull."
              else
                HEADER=":white_check_mark: *${TITLE} — passed*"
                SUMMARY="Pipeline completed successfully."
              fi
              ;;
            failure)
              HEADER=":x: *${TITLE} — failed*"
              SUMMARY="Check the run before retriggering deployments."
              ;;
            cancelled)
              HEADER=":octagonal_sign: *${TITLE} — cancelled*"
              SUMMARY="The run was cancelled."
              ;;
            skipped)
              HEADER=":fast_forward: *${TITLE} — skipped*"
              SUMMARY="The watched job did not run (its condition was not met)."
              ;;
            *)
              HEADER=":grey_question: *${TITLE} — ${STATUS}*"
              SUMMARY=""
              ;;
          esac

          # ── message body ──────────────────────────────────────────────────
          # Hand-written style: one bold header line, then short lines/bullets.
          # Built in bash — \` inside double quotes is a literal backtick
          # (jq must never see one: it parses backticks as interpolation).
          TEXT="${HEADER}"
          if [ -n "${PING}" ];    then TEXT="${TEXT}"$'\n'"${PING}"; fi
          if [ -n "${SUMMARY}" ]; then TEXT="${TEXT}"$'\n'"${SUMMARY}"; fi
          if [ -n "${DETAIL}" ];  then TEXT="${TEXT}"$'\n'":warning: ${DETAIL}"; fi

          # Metadata bullets — only for ran pipelines, and only what's present.
          if [ "${STATUS}" = "success" ] || [ "${STATUS}" = "failure" ]; then
            TEXT="${TEXT}"$'\n'"• Branch: \`${IN_BRANCH}\`"
            if [ -n "${IMAGE_TAG}" ];    then TEXT="${TEXT}"$'\n'"• Tag: \`${IMAGE_TAG}\`"; fi
            if [ -n "${DIGEST_SHORT}" ]; then TEXT="${TEXT}"$'\n'"• Digest: \`${DIGEST_SHORT}…\`"; fi
            if [ -n "${SCAN_SUMMARY}" ]; then TEXT="${TEXT}"$'\n'"• Scan: ${SCAN_SUMMARY}"; fi
            TEXT="${TEXT}"$'\n'"• Triggered by: ${IN_ACTOR}"
          fi

          # ── blocks ────────────────────────────────────────────────────────
          section_block=$(jq -nc --arg t "${TEXT}" \
            '{type:"section",text:{type:"mrkdwn",text:$t}}')

          run_button="$(jq -nc --arg u "${RUN_URL}" \
            '{type:"button",text:{type:"plain_text",text:"View run",emoji:true},url:$u}')"

          # Docker Hub button only for a genuinely published image.
          if [ -n "${DOCKERHUB_REPO}" ] && [ -n "${IMAGE_DIGEST}" ]; then
            HUB_URL="https://hub.docker.com/r/${DOCKERHUB_REPO}/tags?name=${IMAGE_TAG}"
            hub_button="$(jq -nc --arg u "${HUB_URL}" \
              '{type:"button",text:{type:"plain_text",text:"Docker Hub",emoji:true},url:$u}')"
            actions_block="$(printf '%s\n' "${run_button}" "${hub_button}" \
              | jq -s '{type:"actions",elements:.}')"
          else
            actions_block="$(printf '%s\n' "${run_button}" \
              | jq -s '{type:"actions",elements:.}')"
          fi

          context_block=$(jq -nc \
            --arg t "<${RUN_URL}|${IN_REPO} · run ${IN_RUN_ID}> · <${COMMIT_URL}|commit ${SHA_SHORT}>" \
            '{type:"context",elements:[{type:"mrkdwn",text:$t}]}')

          # Plain-text fallback (drives the phone/desktop notification preview).
          case "${STATUS}" in
            success)
              if [ -n "${IMAGE_REF}" ] && [ -n "${IMAGE_DIGEST}" ]; then
                FALLBACK="${PING}${TITLE}: ${IMAGE_TAG:-$IMAGE_REF} published on ${IN_BRANCH} (${IN_REPO})"
              else
                FALLBACK="${PING}${TITLE} passed on ${IN_BRANCH} (${IN_REPO})"
              fi ;;
            failure)   FALLBACK="${PING}${TITLE} FAILED on ${IN_BRANCH} (${IN_REPO})" ;;
            cancelled) FALLBACK="${TITLE} cancelled on ${IN_BRANCH} (${IN_REPO})" ;;
            skipped)   FALLBACK="${TITLE} skipped on ${IN_BRANCH} (${IN_REPO})" ;;
            *)         FALLBACK="${TITLE}: ${STATUS} on ${IN_BRANCH} (${IN_REPO})" ;;
          esac

          # ── send ──────────────────────────────────────────────────────────
          payload="$(printf '%s\n' "${section_block}" "${actions_block}" "${context_block}" \
            | jq -s --arg channel "${SLACK_CHANNEL_ID}" --arg text "${FALLBACK}" \
                '{channel:$channel, text:$text, unfurl_links:false, unfurl_media:false, blocks:.}')"

          response="$(curl -sS -X POST 'https://slack.com/api/chat.postMessage' \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "${payload}")"

          if [ "$(jq -r '.ok' <<<"${response}")" != "true" ]; then
            echo "::warning title=Slack notification failed::chat.postMessage returned: ${response}"
            echo "Common causes: invalid token (invalid_auth), bot not invited to the channel (not_in_channel), missing chat:write scope."
            exit 1
          fi
          echo "Slack notification delivered to ${SLACK_CHANNEL_ID} (${STATUS})."
